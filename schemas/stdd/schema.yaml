name: stdd
version: 1
description: Spec & Test Driven Development工作流，整合OpenSpec和Superpowers
artifacts:
  - id: proposal
    generates: proposal.md
    description: 阐述本次变更动机的初始提案文档
    template: proposal.md
    instruction: >
      创建提案文档，明确说明「为什么」需要本次变更。


      章节要求：

      - **Why**：用 1-2 句话说明所解决的问题或机会。要解决什么问题？为什么是现在？

      - **What Changes**：以条目形式列出变更内容，明确说明新增能力、修改点或移除项。
      破坏性变更必须用 **BREAKING** 标记。

      - **Capabilities**：标识将要新建或修改的 spec：
        - **New Capabilities**：列出新引入的能力，每一项会生成 `specs/<name>/spec.md`，使用 kebab-case 命名（例如 `user-auth`、`data-export`）。
        - **Modified Capabilities**：列出 REQUIREMENTS 发生变化的既有能力。仅当 spec 级别行为变化时才列入（实现细节调整不算）。每项需要一个 delta spec 文件。请先在 `openspec/specs/` 中确认既有 spec 名称。若无 requirement 变化则留空。
      - **Impact**：受影响的代码、API、依赖或系统。


      重要：Capabilities 章节是关键，它在 proposal 与 specs 阶段之间建立契约。

      填写前请先调研既有 specs。这里列出的每一个 capability 都需要对应的 spec 文件。


      整体保持精简（1-2 页）。聚焦「为什么」而非「怎么做」——

      实现细节属于 design.md 的范畴。


      这是一切的基础，specs、design、tasks 都建立在它之上。
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: 本次变更对应的详细规范文档
    template: spec.md
    instruction: >
      创建规范文件，定义系统「应当做什么」。


      为 proposal 的 Capabilities 章节中列出的每一个 capability 创建一个 spec 文件。

      - 新增 capability：使用 proposal 中给定的 kebab-case 名称
      （路径为 specs/<capability>/spec.md）。

      - 修改既有 capability：复用 openspec/specs/<capability>/ 下既有的 spec 目录名，
      在 specs/<capability>/spec.md 创建 delta spec。


      Delta 操作（使用 ## 标题）：

      - **ADDED Requirements**：新增的能力

      - **MODIFIED Requirements**：变更的行为 —— 必须包含完整更新后的内容

      - **REMOVED Requirements**：废弃的功能 —— 必须包含 **Reason**
      与 **Migration**

      - **RENAMED Requirements**：仅名称变更 —— 使用 FROM:/TO: 格式


      格式约束：

      - 每条 requirement：`### Requirement: <名称>`，后跟描述

      - 规范性要求统一使用 SHALL/MUST（避免 should/may）

      - 每个 scenario：`#### Scenario: <名称>`，使用 WHEN/THEN 格式

      - **关键**：Scenario 必须使用恰好 4 个井号（`####`）。
      使用 3 个井号或改用条目都会被静默忽略。

      - 每条 requirement 至少包含一个 scenario。


      MODIFIED requirement 的标准流程：

      1. 在 openspec/specs/<capability>/spec.md 中定位既有 requirement

      2. 复制完整的 requirement 块（从 `### Requirement:` 到全部 scenarios）

      3. 粘贴到 `## MODIFIED Requirements` 之下，编辑以反映新行为

      4. 确保标题文本完全一致（忽略空白差异）


      常见陷阱：以 MODIFIED 形式只贴出部分内容，归档时会丢失细节。

      若仅是新增关注点而不改变既有行为，请改用 ADDED。


      示例：

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs 必须可被验证 —— 每个 scenario 都是潜在的测试用例。
    requires:
      - proposal
  - id: design
    generates: design.md
    description: 包含实现细节的技术设计文档
    template: design.md
    instruction: >
      创建设计文档，说明「如何」实现本次变更。


      满足以下任一条件时才需要创建 design.md：

      - 跨切面变更（涉及多个服务/模块）或引入新的架构模式

      - 引入新的外部依赖或显著的数据模型变化

      - 涉及安全、性能或迁移复杂度

      - 在编码前需要先做技术决策的歧义点


      章节要求：

      - **Context**：背景、当前状态、约束、相关方

      - **Goals / Non-Goals**：本设计要达成的目标，以及明确排除的内容

      - **Decisions**：关键技术选型与理由（为什么选 X 而不是 Y？）。
      每个决策都要列出已考虑的备选方案。
      - **业务流程**：核心业务流程，尽量使用Mermaid流程图来表达，如不涉及业务逻辑，可忽略此项
      - **数据模型**：相关数据模型，可使用Mermaid类图来表示，可按照新增、变更、移除分类描述
      - **Risks / Trade-offs**：已知限制、可能出问题的地方。
      格式：[风险] → 缓解措施

      - **Migration Plan**：发布步骤、回滚策略（如适用）

      - **Open Questions**：尚未解决的决策或未知点


      聚焦于架构与方法，而不是逐行实现。

      动机引用 proposal，需求引用 specs。


      好的设计文档解释技术决策背后的「为什么」。
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: 可追踪的实现任务清单
    template: tasks.md
    instruction: >
      创建任务清单，将实现工作拆解为可执行项。


      **重要：必须严格遵循下方模板的格式。** apply 阶段会解析

      checkbox 来跟踪进度。未使用 `- [ ]` 的任务不会被跟踪。


      指南：

      - 相关任务归入带编号的 ## 标题分组

      - 每个任务必须是 checkbox：`- [ ] X.Y 任务描述`

      - 任务粒度应足够小，可在一次会话内完成

      - 按依赖顺序排列（先做什么？）


      示例：

      ```

      ## 1. Setup


      - [ ] 1.1 Create new module structure

      - [ ] 1.2 Add dependencies to package.json


      ## 2. Core Implementation


      - [ ] 2.1 Implement data export function

      - [ ] 2.2 Add CSV formatting utilities

      ```


      需求引用 specs，方法引用 design。

      每个任务都应可验证 —— 你能明确判断它是否完成。
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    阅读上下文文件，逐项推进未完成的任务，完成后立即勾选。
    遇到阻塞或需要澄清时立即暂停。
